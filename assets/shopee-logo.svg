{"message":"<file name=\"/projects/sandbox/achadinnbr.github.io/assets/shopee-logo.svg\" language=\"plaintext\" >\n<content>\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 120 150\" fill=\"none\">\n  <!-- Handle -->\n  <path d=\"M42 30 C42 15, 78 15, 78 30\" stroke=\"#EE4D2D\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"/>\n  <!-- Bag body -->\n  <rect x=\"20\" y=\"35\" width=\"80\" height=\"75\" rx=\"12\" fill=\"#EE4D2D\"/>\n  <!-- Letter S -->\n  <path d=\"M52 60c0-4 3.5-7 8-7s8 3 8 7c0 3-2 5-5 6.5-3 1.5-6 3-6 6 0 4 3.5 7 8 7s8-3 8-7\" \n        stroke=\"white\" stroke-width=\"5\" stroke-linecap=\"round\" fill=\"none\"/>\n  <!-- Shopee text -->\n  <text x=\"60\" y=\"138\" font-family=\"Arial, sans-serif\" font-size=\"18\" font-weight=\"bold\" fill=\"#EE4D2D\" text-anchor=\"middle\">Shopee</text>\n</svg>\n\n</content>\n</file>"}